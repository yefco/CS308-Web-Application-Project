services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: online_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/database/migration.sql:/docker-entrypoint-initdb.d/02_migration.sql
      - ./src/database/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql
      - ./src/database/demo_users.sql:/docker-entrypoint-initdb.d/04_demo_users.sql
      - ./src/database/reviews_seed.sql:/docker-entrypoint-initdb.d/05_reviews_seed.sql
      - ./src/database/triggers.sql:/docker-entrypoint-initdb.d/06_triggers.sql
      - ./src/database/demo_scenario.sql:/docker-entrypoint-initdb.d/07_demo_scenario.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d online_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/online_store
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_strong_random_secret}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
